name: Deploy site to GitHub Pages

on:
  # Nur manuell auslösbar. Der automatische Push-Deploy ist bewusst deaktiviert,
  # weil der Standard-GITHUB_TOKEN GitHub Pages nicht selbst aktivieren darf
  # ("Resource not accessible by integration").
  # Empfohlener, einfachster Weg ohne Workflow:
  #   Settings -> Pages -> Source: "Deploy from a branch" -> Branch wählen.
  # Falls dieser Workflow genutzt werden soll: zuvor unter Settings -> Pages
  # die Source auf "GitHub Actions" stellen, dann hier manuell starten.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
