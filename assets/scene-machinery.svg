<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Forst- und Baumaschinen auf einer Arbeitsfläche">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222826"/>
      <stop offset="0.5" stop-color="#1a3527"/>
      <stop offset="1" stop-color="#0d1d14"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#74c69d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#74c69d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a20"/>
      <stop offset="1" stop-color="#0c1710"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#msky)"/>
  <rect width="1600" height="900" fill="url(#mglow)"/>

  <!-- distant tree line -->
  <g fill="#16301f" opacity="0.7">
    <path d="M0 520 Q 200 480 420 510 T 860 505 T 1300 510 T 1600 520 V620 H0 Z"/>
  </g>
  <g fill="#12281a" opacity="0.85">
    <path d="M80 520 l30 -90 30 90z M260 520 l26 -80 26 80z M480 520 l34 -104 34 104z M720 520 l28 -86 28 86z M980 520 l32 -98 32 98z M1240 520 l26 -80 26 80z M1460 520 l30 -92 30 92z"/>
  </g>

  <!-- log piles -->
  <g fill="#3a2a1c" stroke="#241a11" stroke-width="3">
    <g transform="translate(120,560)">
      <circle cx="20" cy="40" r="20"/><circle cx="62" cy="40" r="20"/><circle cx="104" cy="40" r="20"/>
      <circle cx="41" cy="8" r="20"/><circle cx="83" cy="8" r="20"/>
    </g>
  </g>
  <g fill="#46331f" stroke="#241a11" stroke-width="3">
    <g transform="translate(120,560)">
      <circle cx="20" cy="40" r="9" fill="#6b4f30"/><circle cx="62" cy="40" r="9" fill="#6b4f30"/><circle cx="104" cy="40" r="9" fill="#6b4f30"/>
      <circle cx="41" cy="8" r="9" fill="#6b4f30"/><circle cx="83" cy="8" r="9" fill="#6b4f30"/>
    </g>
  </g>

  <!-- ground -->
  <path d="M0 640 Q 400 610 800 635 T 1600 640 V900 H0 Z" fill="url(#ground)"/>

  <!-- excavator silhouette -->
  <g transform="translate(900,360)" fill="#0c1810">
    <!-- tracks -->
    <rect x="40" y="250" width="320" height="46" rx="23" fill="#0a140d"/>
    <circle cx="70" cy="273" r="22" fill="#16241a"/><circle cx="330" cy="273" r="22" fill="#16241a"/>
    <!-- body -->
    <path d="M70 250 q -10 -70 60 -76 l150 0 q 40 0 50 30 l20 46 -10 0 0 0 z" fill="#1f3a29"/>
    <rect x="120" y="150" width="120" height="80" rx="14" fill="#234430"/>
    <!-- cabin window -->
    <rect x="135" y="165" width="80" height="52" rx="8" fill="#9fd9bd" opacity="0.5"/>
    <!-- arm -->
    <path d="M250 175 L420 90 L452 120 L300 220 Z" fill="#2a5038"/>
    <path d="M420 90 L520 170 L500 200 L398 128 Z" fill="#234430"/>
    <!-- bucket -->
    <path d="M500 175 q 60 10 70 70 l-70 8 q -20 -40 0 -86 z" fill="#1c3526"/>
    <!-- accent -->
    <rect x="120" y="234" width="120" height="8" fill="#52b788" opacity="0.5"/>
  </g>

  <!-- wheel loader silhouette (smaller, left) -->
  <g transform="translate(250,520)" fill="#11271a">
    <rect x="30" y="60" width="150" height="60" rx="14" fill="#1c3826"/>
    <rect x="60" y="30" width="70" height="40" rx="8" fill="#214330"/>
    <rect x="68" y="38" width="54" height="26" rx="5" fill="#9fd9bd" opacity="0.45"/>
    <circle cx="60" cy="128" r="26" fill="#0a140d"/><circle cx="160" cy="128" r="26" fill="#0a140d"/>
    <circle cx="60" cy="128" r="11" fill="#1c3826"/><circle cx="160" cy="128" r="11" fill="#1c3826"/>
    <path d="M30 90 L-30 70 L-30 120 L30 110 Z" fill="#1c3826"/>
    <path d="M-30 64 l-26 -4 0 70 26 -4z" fill="#16301f"/>
  </g>

  <rect width="1600" height="900" fill="#0c1f15" opacity="0.1"/>
</svg>
