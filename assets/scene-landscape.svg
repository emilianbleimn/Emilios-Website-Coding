<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gepflegte Gartenanlage mit Pflasterweg und Hecken">
  <defs>
    <linearGradient id="lsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274034"/>
      <stop offset="0.55" stop-color="#1f4030"/>
      <stop offset="1" stop-color="#102a1c"/>
    </linearGradient>
    <radialGradient id="lglow" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#cdeedb" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#cdeedb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6a4f"/>
      <stop offset="1" stop-color="#16361f"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7a72"/>
      <stop offset="1" stop-color="#aab4ab"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#lsky)"/>
  <rect width="1600" height="900" fill="url(#lglow)"/>

  <!-- distant trees -->
  <g fill="#1a3c29" opacity="0.7">
    <circle cx="180" cy="430" r="70"/><circle cx="260" cy="450" r="55"/>
    <circle cx="1360" cy="430" r="80"/><circle cx="1450" cy="450" r="60"/>
    <circle cx="780" cy="420" r="60"/>
  </g>

  <!-- lawn -->
  <path d="M0 470 Q 400 440 800 460 T 1600 470 V900 H0 Z" fill="url(#lawn)"/>

  <!-- hedges -->
  <g fill="#1f5236">
    <rect x="0" y="470" width="1600" height="40" rx="20" opacity="0.6"/>
    <rect x="120" y="430" width="260" height="70" rx="34"/>
    <rect x="1220" y="430" width="260" height="70" rx="34"/>
  </g>

  <!-- paved path (perspective) -->
  <polygon points="700,470 900,470 1180,900 420,900" fill="url(#path)"/>
  <g stroke="#5c665e" stroke-width="3" opacity="0.7">
    <line x1="730" y1="520" x2="870" y2="520"/>
    <line x1="700" y1="600" x2="900" y2="600"/>
    <line x1="660" y1="700" x2="940" y2="700"/>
    <line x1="600" y1="820" x2="1000" y2="820"/>
    <line x1="800" y1="470" x2="800" y2="900"/>
    <line x1="740" y1="600" x2="660" y2="900"/>
    <line x1="860" y1="600" x2="940" y2="900"/>
  </g>

  <!-- shrubs / ornamental trees foreground -->
  <g>
    <circle cx="300" cy="640" r="90" fill="#1d4d33"/>
    <circle cx="240" cy="700" r="70" fill="#19422c"/>
    <rect x="295" y="700" width="14" height="80" fill="#3a2a1c"/>
    <circle cx="1320" cy="650" r="100" fill="#1d4d33"/>
    <circle cx="1390" cy="710" r="74" fill="#19422c"/>
    <rect x="1313" y="710" width="16" height="90" fill="#3a2a1c"/>
  </g>

  <!-- flower beds -->
  <g>
    <ellipse cx="500" cy="760" rx="120" ry="34" fill="#163420"/>
    <circle cx="450" cy="745" r="9" fill="#74c69d"/><circle cx="500" cy="752" r="9" fill="#9fd9bd"/><circle cx="555" cy="746" r="9" fill="#52b788"/>
    <ellipse cx="1120" cy="780" rx="130" ry="36" fill="#163420"/>
    <circle cx="1070" cy="766" r="9" fill="#9fd9bd"/><circle cx="1125" cy="772" r="9" fill="#74c69d"/><circle cx="1180" cy="766" r="9" fill="#52b788"/>
  </g>

  <rect width="1600" height="900" fill="#0c1f15" opacity="0.14"/>
</svg>
