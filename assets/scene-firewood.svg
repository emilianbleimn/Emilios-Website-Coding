<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gestapeltes Kamin- und Brennholz">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a22"/>
      <stop offset="0.5" stop-color="#1b3b28"/>
      <stop offset="1" stop-color="#0e1f15"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#f0b27a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f0b27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logface" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#c79a63"/>
      <stop offset="0.7" stop-color="#9a7444"/>
      <stop offset="1" stop-color="#6b4f30"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fsky)"/>
  <rect width="1600" height="900" fill="url(#fglow)"/>

  <!-- background conifers -->
  <g fill="#15301f" opacity="0.7">
    <path d="M120 360 l40 -150 40 150z M120 320 l40 -120 40 120z"/>
    <path d="M1380 360 l44 -160 44 160z M1380 320 l44 -126 44 126z"/>
  </g>

  <!-- stacked log wall (cut faces) -->
  <g>
    <!-- generate rows of logs -->
    <g id="row">
      <circle cx="0" cy="0" r="38" fill="url(#logface)" stroke="#5a4226" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#7c5c36" stroke-width="2" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#7c5c36" stroke-width="1.5" opacity="0.5"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#7c5c36" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>
  <g>
    <!-- Row build via transforms -->
    <g transform="translate(80,470)">
      <use href="#row"/><use href="#row" x="80"/><use href="#row" x="160"/><use href="#row" x="240"/><use href="#row" x="320"/><use href="#row" x="400"/><use href="#row" x="480"/><use href="#row" x="560"/><use href="#row" x="640"/><use href="#row" x="720"/><use href="#row" x="800"/><use href="#row" x="880"/><use href="#row" x="960"/><use href="#row" x="1040"/><use href="#row" x="1120"/><use href="#row" x="1200"/><use href="#row" x="1280"/><use href="#row" x="1360"/><use href="#row" x="1440"/>
    </g>
    <g transform="translate(80,548)">
      <use href="#row"/><use href="#row" x="80"/><use href="#row" x="160"/><use href="#row" x="240"/><use href="#row" x="320"/><use href="#row" x="400"/><use href="#row" x="480"/><use href="#row" x="560"/><use href="#row" x="640"/><use href="#row" x="720"/><use href="#row" x="800"/><use href="#row" x="880"/><use href="#row" x="960"/><use href="#row" x="1040"/><use href="#row" x="1120"/><use href="#row" x="1200"/><use href="#row" x="1280"/><use href="#row" x="1360"/><use href="#row" x="1440"/>
    </g>
    <g transform="translate(80,626)">
      <use href="#row"/><use href="#row" x="80"/><use href="#row" x="160"/><use href="#row" x="240"/><use href="#row" x="320"/><use href="#row" x="400"/><use href="#row" x="480"/><use href="#row" x="560"/><use href="#row" x="640"/><use href="#row" x="720"/><use href="#row" x="800"/><use href="#row" x="880"/><use href="#row" x="960"/><use href="#row" x="1040"/><use href="#row" x="1120"/><use href="#row" x="1200"/><use href="#row" x="1280"/><use href="#row" x="1360"/><use href="#row" x="1440"/>
    </g>
    <g transform="translate(80,704)">
      <use href="#row"/><use href="#row" x="80"/><use href="#row" x="160"/><use href="#row" x="240"/><use href="#row" x="320"/><use href="#row" x="400"/><use href="#row" x="480"/><use href="#row" x="560"/><use href="#row" x="640"/><use href="#row" x="720"/><use href="#row" x="800"/><use href="#row" x="880"/><use href="#row" x="960"/><use href="#row" x="1040"/><use href="#row" x="1120"/><use href="#row" x="1200"/><use href="#row" x="1280"/><use href="#row" x="1360"/><use href="#row" x="1440"/>
    </g>
    <g transform="translate(80,782)">
      <use href="#row"/><use href="#row" x="80"/><use href="#row" x="160"/><use href="#row" x="240"/><use href="#row" x="320"/><use href="#row" x="400"/><use href="#row" x="480"/><use href="#row" x="560"/><use href="#row" x="640"/><use href="#row" x="720"/><use href="#row" x="800"/><use href="#row" x="880"/><use href="#row" x="960"/><use href="#row" x="1040"/><use href="#row" x="1120"/><use href="#row" x="1200"/><use href="#row" x="1280"/><use href="#row" x="1360"/><use href="#row" x="1440"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="#0c1f15" opacity="0.18"/>
</svg>
